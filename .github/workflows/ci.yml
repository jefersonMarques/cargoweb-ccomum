name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - run: go mod download
      - run: go run github.com/a-h/templ/cmd/templ@v0.3.1020 generate
      - run: go test ./...
      - run: go vet ./...
